name: Sync upstream and deploy

# Fork-only workflow (not present upstream, so merges never conflict on it).
# Weekly: merge tashfeenahmed/freellmapi main into our main, verify, push, then
# trigger the Render deploy hook. Conflicts or failed checks push nothing and
# fail the run (see the run summary).

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Trigger the Render deploy after a successful sync'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/tashfeenahmed/freellmapi.git

jobs:
  sync:
    name: Merge, verify, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main --tags
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Fork is $behind commit(s) behind upstream/main"

      - name: Merge upstream/main
        id: merge
        if: steps.fetch.outputs.behind != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge --no-edit upstream/main -m "Merge upstream/main ($(git rev-parse --short upstream/main)) into fork"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      # Issues are off by default on forks, so report in the run summary and
      # fail the job (GitHub emails the owner about failed scheduled runs).
      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          {
            echo "### Upstream sync blocked by merge conflict"
            echo "Merging upstream/main ($(git rev-parse --short upstream/main)) into main conflicts in:"
            sed 's/^/- /' conflicts.txt
            echo
            echo "Nothing was pushed or deployed. Resolve on a branch (git merge upstream/main), test, push main, then run this workflow again or deploy manually on Render."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Set up Node
        if: steps.fetch.outputs.behind != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.fetch.outputs.behind != '0'
        run: npm ci

      - name: Build
        if: steps.fetch.outputs.behind != '0'
        run: npm run build

      # The gate covers what the fork owns plus the media/catalog paths it
      # touches. The longer timeout absorbs the 5s timeouts seen on slow machines.
      - name: Fork-critical tests
        if: steps.fetch.outputs.behind != '0'
        working-directory: server
        run: npx vitest run --pool=forks --fileParallelism=false --testTimeout=30000 elevenlabs media catalog-sync declarative

      - name: Full server suite (advisory)
        if: steps.fetch.outputs.behind != '0'
        continue-on-error: true
        run: npm run test -w server -- --testTimeout=30000

      - name: Push main
        if: steps.fetch.outputs.behind != '0'
        run: git push origin HEAD:main

      - name: Trigger Render deploy
        if: steps.fetch.outputs.behind != '0' && inputs.deploy != false
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not set; pushed main but did not deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render deploy triggered"
